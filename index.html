function welcome(){$('#app').innerHTML=`<div class="hero"><div><h1>Welcome! ಸ್ವಾಗತ</h1><p>Two friendly teachers are ready to help you learn English.</p></div><div class="chars"><div>${svgChar('Anaya')}</div><div>${svgChar('Arjun')}</div></div></div>
 <div class="card"><b>I am a... (optional)</b><div class="note">We use this only to suggest your teacher. It stays on your phone. You can change the teacher any time.</div>
 <div class="row" style="margin-top:10px"><button class="btn" onclick="setG('girl')">Girl / Woman</button><button class="btn" onclick="setG('boy')">Boy / Man</button><button class="btn alt" onclick="setG('na')">Prefer not to say</button></div></div>`}
function home(){
 if(!S.g)return welcome();
  let h=`<div class="hero"><div><h1>Learn English with ${S.p}</h1><p>ಇಂಗ್ಲಿಷ್ ಕಲಿಯಿರಿ - listen, speak, play. A to Z, step by step.</p><a class="btn sm" href="#/lesson/1/0">Start now ›</a></div>
 <div class="chars"><div class="${S.p==='Anaya'?'sel':''}" onclick="pick('Anaya')">${svgChar('Anaya')}</div><div class="${S.p==='Arjun'?'sel':''}" onclick="pick('Arjun')">${svgChar('Arjun')}</div></div></div>`;
 h+=tutorBox(S.p==='Anaya'?`Hi! I am Anaya, your English teacher. Pick a lesson and I will help you. Small steps every day! 😊`:`Hi! I am Arjun, your English teacher. Let us start. Small steps every day! 💪`);
 h+=`<div class="card"><b>Your rewards</b><div class="goal">Today: ${S.days.includes(today())?'✅ lesson done':'⬜ finish 1 lesson'} | 🔥 ${streak()} day streak | ⭐ ${S.xp} XP</div><div>${BADGES.map(b=>`<span class="bdg ${(S.b||{})[b[1]]?'':'off'}">${b[0]} ${b[1]}</span>`).join('')}</div>
 <div class="row" style="margin-top:10px"><span class="note">Tap a teacher above to switch.</span><a class="btn sm alt" href="#/ask">💬 Ask teacher</a></div>
 <div class="note" style="margin-top:6px">Your teacher: ${S.p} ${S.g==='na'?'(you chose)':'(suggested for you)'}. Tap the other teacher above to switch. Voices come from your phone. Use Chrome for the best voice and speaking check.</div></div>`;
 LEVELS.forEach(l=>{
  if(l.soon){h+=`<div class="card lv soon"><b>${l.name}</b> <span class="tag">Coming soon</span><div class="note">${l.kn} - ${l.soon}. Advanced levels will be added later.</div></div>`;return}
  const n=l.lessons.filter((_,i)=>S.done[l.id+'-'+i]).length;
  h+=`<div class="card lv"><b>${l.name}</b> <span class="tag g">Free</span><div class="note">${l.kn} - ${n}/${l.lessons.length} lessons done</div><div class="prog" style="margin:8px 0 0"><i style="width:${100*n/l.lessons.length}%"></i></div>`;
  l.lessons.forEach((x,i)=>{const d=S.done[l.id+'-'+i];h+=`<a class="ls" href="#/lesson/${l.id}/${i}"><div><b>${i+1}. ${x.t}</b><span>${x.kn} - ${x.items.length} words</span></div><span class="${d?'done':''}">${d?'✓ Done':'Start ›'}</span></a>`});
  h+=`</div>`});
 $('#app').innerHTML=h}
function pick(p){S.p=p;save();home()}
function lesson(l,i){const x=LEVELS[l-1].lessons[i];let k=0;
 function card(){const it=x.items[k];
  $('#app').innerHTML=`<div class="prog"><i style="width:${100*k/x.items.length}%"></i></div>`+
  tutorBox(k==0?`Lesson: <b>${x.t}</b>. Listen first, then say it out loud.`:`Good! Next one.`)+
  `<div class="card"><div class="big">${esc(it.en)}</div><div class="kn">${it.kn}</div><div class="say">${it.say!==it.en?esc(it.say):''}</div>
  <div class="row" style="justify-content:center;margin-top:10px"><button class="btn sm" id="b1">🔊 Listen ಕೇಳಿ</button><button class="btn sm alt" id="b2">🐢 Slow</button><button class="btn sm alt" id="b3">🎤 Speak ಹೇಳಿ</button></div>
  <div class="fb" id="fb" style="text-align:center"></div></div>
  <div class="row"><button class="btn alt" id="pv" ${k?'':'disabled'}>‹ Back</button><button class="btn" id="nx">${k==x.items.length-1?'Start quiz ›':'Next ಮುಂದೆ ›'}</button></div>`;
  $('#b1').onclick=()=>speak(it.say);$('#b2').onclick=()=>speak(it.say,true);
  $('#b3').onclick=()=>{const f=$('#fb');f.className='fb';f.textContent='Listening... speak now';
   listen(it.say,a=>{if(a===null){f.textContent='Speaking check needs Chrome. Say it out loud anyway - you can do it!';return}
    if(!a.length){f.className='fb bad';f.textContent='I could not hear you. Try again.';return}
    const sc=Math.max(...a.map(t=>score(it.en,t)),...a.map(t=>score(it.say,t)));
    if(sc>=80){f.className='fb ok';f.textContent='Great! I heard: "'+a[0]+'" ('+sc+'%)';S.xp+=2;save()}
    else{f.className='fb bad';f.textContent='I heard: "'+a[0]+'" ('+sc+'%). Listen again and try once more.'}})};
  $('#pv').onclick=()=>{k--;card()};$('#nx').onclick=()=>{if(k<x.items.length-1){k++;card()}else quiz(l,i)}}
 card()}
function quiz(l,i){const x=LEVELS[l-1].lessons[i];const all=[].concat(...LEVELS.flatMap(v=>v.lessons.map(z=>z.items)));
 const items=shuf(x.items).slice(0,Math.min(8,x.items.length));const qs=[];
 items.forEach((it,n)=>{const t=n%3;
  if(t===0){const o=shuf(x.items.filter(z=>z.kn!==it.kn).concat(all.filter(z=>z.kn!==it.kn))).filter((z,j,a)=>a.findIndex(y=>y.kn===z.kn)===j).slice(0,3).map(z=>z.kn);qs.push({q:`What does <b>${esc(it.en)}</b> mean in Kannada?`,o:shuf(o.concat(it.kn)),a:it.kn,listen:it.say})}
  else if(t===1){const o=shuf(x.items.filter(z=>z.en!==it.en).concat(all.filter(z=>z.en!==it.en))).filter((z,j,a)=>a.findIndex(y=>y.en===z.en)===j).slice(0,3).map(z=>z.en);qs.push({q:`Which English is <b>${it.kn}</b>?`,o:shuf(o.concat(it.en)),a:it.en})}
  else qs.push({q:`Type in English: <b>${it.kn}</b>`,type:1,a:it.en,hint:it.en.split(' ').map(w=>w[0]+'_'.repeat(Math.max(0,w.length-1))).join(' ')})});
 let k=0,ok=0;
 function show(){const q=qs[k];let h=`<div class="prog"><i style="width:${100*k/qs.length}%"></i></div><div class="card"><div class="note">Quiz ${k+1} of ${qs.length}</div><h2 style="margin-top:4px">${q.q}</h2>`;
  if(q.listen)h+=`<button class="btn sm alt" id="ls">🔊 Listen</button>`;
  if(q.type)h+=`<div class="note">Hint: ${q.hint}</div><input type="text" id="ti" autocomplete="off" autocapitalize="off" style="margin-top:8px"><button class="btn" id="ck" style="margin-top:10px">Check ಪರಿಶೀಲಿಸಿ</button>`;
  else q.o.forEach((o,j)=>h+=`<button class="opt" data-j="${j}">${esc(o)}</button>`);
  h+=`<div class="fb" id="fb"></div><button class="btn" id="nq" style="display:none">Next ಮುಂದೆ ›</button></div>`;$('#app').innerHTML=h;
  if(q.listen)$('#ls').onclick=()=>speak(q.listen);
  const fin=good=>{const f=$('#fb');if(good){ok++;S.xp+=5;f.className='fb ok';f.textContent='Correct ಸರಿ! +5 XP'}else{f.className='fb bad';f.textContent='Not correct. Answer: '+q.a}
   save();const n=$('#nq');n.style.display='inline-block';n.onclick=()=>{k++;k<qs.length?show():end()}};
  if(q.type){$('#ck').onclick=()=>{$('#ck').disabled=true;$('#ti').disabled=true;fin(norm($('#ti').value)===norm(q.a))};$('#ti').addEventListener('keydown',e=>{if(e.key==='Enter')$('#ck').click()})}
  else document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const g=q.o[+b.dataset.j]===q.a;document.querySelectorAll('.opt').forEach(z=>{z.disabled=true;if(q.o[+z.dataset.j]===q.a)z.classList.add('ok')});if(!g)b.classList.add('bad');fin(g)})}
 function end(){const pct=Math.round(100*ok/qs.length);const pass=pct>=60;if(pass){S.done[l+'-'+i]=1;S.xp+=10}touch();save();checkBadges();
  const nx=LEVELS[l-1].lessons[i+1];
  $('#app').innerHTML=tutorBox(pass?`Well done! You scored ${pct}%. +10 XP. Come back tomorrow to keep your streak. 🎉`:`You scored ${pct}%. No problem - practice the lesson once more, then try again.`)+
  `<div class="card"><div class="big">${ok} / ${qs.length}</div><div class="row" style="justify-content:center;margin-top:10px"><a class="btn alt" href="#/lesson/${l}/${i}">Practice again</a>${pass&&nx?`<a class="btn" href="#/lesson/${l}/${i+1}">Next lesson ›</a>`:''}<a class="btn alt" href="#/">All lessons</a></div></div>`;
  if(pass)speak('Well done!')}
 show()}
function ask(){let h=`<h1>Ask the teacher</h1>`+tutorBox(`Write a sentence and I will correct it. Or ask me any English question. Simple words are okay.`)+
 `<div class="card chat" id="ch"></div><div class="card"><textarea id="q" rows="2" placeholder="Example: I am go to office yesterday"></textarea><div class="row" style="margin-top:8px"><button class="btn" id="go">Send</button><a class="btn alt" href="#/">Back</a></div><div class="note">Answers come from AI and can have mistakes.</div></div>`;
 $('#app').innerHTML=h;const ch=$('#ch');
 $('#go').onclick=async()=>{const t=$('#q').value.trim();if(!t)return;$('#q').value='';ch.innerHTML+=`<div class="m u">${esc(t)}</div>`;
  const w=document.createElement('div');w.className='m t';w.textContent='...';ch.appendChild(w);ch.scrollTop=1e5;
  try{const r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t,persona:S.p,level:'Beginner'})});const j=await r.json();w.textContent=j.reply;speak(j.reply.slice(0,200))}
  catch(e){w.textContent='No internet. Please try again.'}ch.scrollTop=1e5}}
function route(){("speechSynthesis" in window)&&speechSynthesis.cancel();const p=location.hash.replace(/^#\/?/,'').split('/');window.scrollTo(0,0);
 if(p[0]==='lesson'&&LEVELS[p[1]-1]&&LEVELS[p[1]-1].lessons[p[2]])lesson(+p[1],+p[2]);else if(p[0]==='ask')ask();else home()}
addEventListener('hashchange',route);hdr();route();
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script></body></html>
